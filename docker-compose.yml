services:
  card-management:
    image: card-management-system:latest
    container_name: card-management
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 9902
      DATA_ROOT: ${DATA_ROOT:-/data}
      # Add your traefik config here if needed
      # - TRAEFIK_DOMAIN=cards.yourdomain.com
    ports:
      - "9902:9902"
    volumes:
      # Keep host/container base paths aligned and overrideable.
      - ${HOST_DATA_DIR:-./data}:${DATA_ROOT:-/data}
    restart: unless-stopped
    labels:
      # Traefik labels for automatic subdomain routing
      - "traefik.enable=true"
      - "traefik.http.routers.card-management.rule=Host(`cards.example.com`)"
      - "traefik.http.routers.card-management.entrypoints=websecure"
      - "traefik.http.routers.card-management.tls=true"
      - "traefik.http.routers.card-management.service=card-management"
      - "traefik.http.services.card-management.loadbalancer.server.port=9902"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9902/api/auth/salt?username=healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

